<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사회 정의와 윤리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#F6F8FB; --surface:#FFFFFF; --ink:#1F2A37; --soft:#556270; --line:#E3E8EF; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#12161C; --surface:#1B212A; --ink:#E8ECF1; --soft:#A5B0BC; --line:#2A323D; } }
  :root[data-theme="dark"]{ --bg:#12161C; --surface:#1B212A; --ink:#E8ECF1; --soft:#A5B0BC; --line:#2A323D; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--bg); color:var(--ink); font-family:'Noto Sans KR',sans-serif; font-size:17px; line-height:1.6; }
  .wrap{ max-width:760px; margin:0 auto; padding:40px 16px 56px; }
  .kicker{ font-size:14px; color:var(--soft); letter-spacing:.02em; }
  h1{ font-family:'Gowun Batang',serif; font-size:34px; line-height:1.3; margin:6px 0 4px; }
  .lede{ color:var(--soft); margin-bottom:28px; }
  h2{ font-family:'Gowun Batang',serif; font-size:21px; margin:30px 0 12px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
  a.card{ display:block; text-decoration:none; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px 18px 16px; position:relative; overflow:hidden; transition:transform .15s ease, box-shadow .15s ease; }
  a.card::before{ content:""; position:absolute; inset:0 0 auto 0; height:6px; background:var(--c); }
  a.card:hover{ transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,0,0,.08); }
  .tag{ display:inline-block; font-size:13px; font-weight:700; color:var(--c); margin-bottom:4px; }
  .t{ font-weight:700; font-size:18px; line-height:1.4; }
  .d{ color:var(--soft); font-size:15px; margin-top:4px; }
  footer{ margin-top:40px; text-align:center; color:var(--soft); font-size:14px; }
  @media (prefers-reduced-motion: reduce){ a.card{ transition:none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">현대사회와 윤리 · Ⅳ. 민주시민과 윤리</div>
  <h1>사회 정의와 윤리</h1>
  <p class="lede">03. 사회 정의와 윤리 — 사상가 비교 웹앱입니다.</p>

  <h2>03. 사회 정의와 윤리</h2>
  <div class="grid">
    <a class="card" style="--c:#C2407A" href="https://social-justice-ethics.vercel.app/rawls-nozick"><span class="tag">분배적 정의</span><div class="t">무엇을 어떻게 나누어야 공정한가?</div><div class="d">롤스 · 노직</div></a>
    <a class="card" style="--c:#1B8AA6" href="https://social-justice-ethics.vercel.app/punishment"><span class="tag">교정적 정의</span><div class="t">처벌은 왜 하는가?</div><div class="d">칸트 · 벤담 · 루소 · 베카리아</div></a>
    <a class="card" style="--c:#D2502F" href="quiz"><span class="tag">퀴즈</span><div class="t">「사회 정의와 윤리」 퀴즈</div><div class="d">문제 수와 난이도 선택</div></a>
  </div>
  <p style="margin-top:28px"><a href="https://democratic-citizen-ethics.vercel.app/" style="color:var(--soft)">← Ⅳ. 민주시민과 윤리 전체 모음</a></p>

  <footer>현대사회와 윤리 ♥무늬T♥</footer>
</div>
</body>
</html>
